<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A84FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Controle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Controle de Salário</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">CONTROLE FINANCEIRO</p>
        <h1>Meu dinheiro</h1>
        <p id="monthLabel" class="muted"></p>
      </div>
      <button id="salaryBtn" class="icon-btn" aria-label="Editar salário">⚙️</button>
    </header>

    <section class="balance-card">
      <div class="balance-label">Saldo disponível</div>
      <div id="remaining" class="balance">R$ 0,00</div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="balance-meta">
        <span id="salaryLabel">Salário R$ 0,00</span>
        <span id="percentLabel">0% usado</span>
      </div>
    </section>

    <section class="summary-grid">
      <article class="summary-card">
        <span class="card-icon orange">↗</span>
        <span class="muted">Gastos</span>
        <strong id="spent">R$ 0,00</strong>
      </article>
      <article class="summary-card">
        <span class="card-icon blue">☷</span>
        <span class="muted">Lançamentos</span>
        <strong id="count">0</strong>
      </article>
    </section>

    <button id="addBtn" class="primary-btn">＋ Adicionar gasto</button>

    <section class="section">
      <div class="section-title"><h2>Gastos recentes</h2><button id="allBtn" class="text-btn">Ver todos</button></div>
      <div id="recentList" class="expense-list"></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Por categoria</h2></div>
      <div class="chart-card">
        <canvas id="chart" width="500" height="300"></canvas>
        <div id="legend" class="legend"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home">⌂<span>Início</span></button>
    <button class="tab" data-tab="expenses">☷<span>Gastos</span></button>
    <button class="tab" data-tab="analysis">◔<span>Análises</span></button>
  </nav>

  <dialog id="expenseDialog">
    <form method="dialog" id="expenseForm" class="modal">
      <div class="modal-head"><h2>Novo gasto</h2><button value="cancel" class="close">×</button></div>
      <label>Descrição<input id="title" required maxlength="60" placeholder="Ex.: Mercado"></label>
      <label>Valor<input id="amount" required inputmode="decimal" placeholder="0,00"></label>
      <label>Categoria<select id="category"></select></label>
      <label>Data<input id="date" type="date" required></label>
      <button class="primary-btn" value="default">Salvar gasto</button>
    </form>
  </dialog>

  <dialog id="salaryDialog">
    <form method="dialog" id="salaryForm" class="modal">
      <div class="modal-head"><h2>Meu salário</h2><button value="cancel" class="close">×</button></div>
      <label>Salário líquido mensal<input id="salary" required inputmode="decimal" placeholder="0,00"></label>
      <p class="muted small">O valor será usado para calcular automaticamente quanto sobra no mês.</p>
      <button class="primary-btn" value="default">Salvar</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
